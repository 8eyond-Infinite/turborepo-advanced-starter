services:
  - type: web
    name: turborepo-starter-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    preDeployCommand: node scripts/migrate.mjs
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: turborepo-starter-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: turborepo-starter-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: worker
    name: turborepo-starter-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: turborepo-starter-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: turborepo-starter-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: JWT_REFRESH_SECRET
      - key: METRICS_TOKEN
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: METRICS_TOKEN
      - key: CORS_ORIGINS
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: CORS_ORIGINS
      - key: CLIENT_URL
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: CLIENT_URL
      - key: REFRESH_COOKIE_SAME_SITE
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: REFRESH_COOKIE_SAME_SITE
      - key: MAIL_HOST
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: MAIL_HOST
      - key: MAIL_PORT
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: MAIL_PORT
      - key: MAIL_FROM
        fromService:
          name: turborepo-starter-api
          type: web
          envVarKey: MAIL_FROM

  - type: keyvalue
    name: turborepo-starter-redis
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: turborepo-starter-postgres
    plan: basic-256mb
    region: singapore
    databaseName: turborepo_starter
    user: turborepo_starter
    ipAllowList: []
