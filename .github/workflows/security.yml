name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # 03:00 UTC thứ Hai hàng tuần

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Chạy gitleaks CLI trực tiếp (MIT, miễn phí) — gitleaks-action yêu cầu
      # license key trả phí cho organization repo.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl --fail --location --retry 3 --output "${archive}" \
            "${release_url}/${archive}"
          curl --fail --location --retry 3 --output gitleaks_checksums.txt \
            "${release_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          grep " ${archive}$" gitleaks_checksums.txt | sha256sum --check -
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history
        run: gitleaks detect --source . --redact --no-banner

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_placeholder?schema=public

      - name: Audit all dependencies
        run: pnpm audit --audit-level=high
