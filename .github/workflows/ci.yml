name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      # prisma generate chỉ cần URL đúng định dạng, không cần DB sống
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_placeholder?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=@repo/database db:generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run check-types

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/starter_test?schema=public

      - name: Generate Prisma client
        run: pnpm --filter=@repo/database db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/starter_test?schema=public

      - name: Build workspace dependencies of server
        run: pnpm turbo run build --filter=server^...
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/starter_test?schema=public

      - name: Create server .env.test
        run: |
          cat > apps/server/.env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          JWT_ACCESS_SECRET=ci-only-access-secret-0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET=ci-only-refresh-secret-0123456789abcdef0123456789abcdef
          CORS_ORIGINS=http://localhost:5173
          REDIS_HOST=localhost
          REDIS_PORT=6379
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/starter_test?schema=public
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_FROM=ci@example.com
          EOF

      - name: Run backend E2E
        run: pnpm --filter=server test:e2e

  image:
    name: Build image, SBOM, vulnerability scan
    runs-on: ubuntu-latest
    # Chỉ publish khi code đã qua đủ quality gate và E2E
    needs: [quality, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ghcr yêu cầu tên image chữ thường; tên repo có chữ hoa
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/server" >> "$GITHUB_ENV"

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          artifact-name: server-sbom.spdx.json

      - name: Scan image for vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push immutable image to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
