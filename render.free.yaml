# Demo/staging only. Free Postgres expires and free Key Value is ephemeral.
# Production remains defined in render.yaml.
services:
  - type: web
    name: turborepo-starter-api-free
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c "node scripts/migrate.mjs && node scripts/seed.mjs && node dist/main.js"
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: turborepo-starter-postgres-free
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: turborepo-starter-redis-free
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: ALLOW_PRODUCTION_SEED
        value: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: turborepo-starter-redis-free
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: turborepo-starter-postgres-free
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    databaseName: turborepo_starter_free
    user: turborepo_starter_free
    ipAllowList: []
